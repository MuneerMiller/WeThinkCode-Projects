name: Coursework tests

on:
  push:
    branches: [main]
    paths: ['python/**', 'java/**', '.github/workflows/coursework.yml']
  pull_request:
    paths: ['python/**', 'java/**', '.github/workflows/coursework.yml']

permissions:
  contents: read

jobs:
  python:
    name: Python projects
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run each project's unit tests
        # toy-robot-5-maze is an unfinished submission whose maze.text
        # module was never written, so it is skipped.
        run: |
          failed=0
          for dir in python/*/; do
            name=$(basename "$dir")
            [ "$name" = toy-robot-5-maze ] && continue
            echo "::group::$name"
            (cd "$dir" && python -m unittest < /dev/null) || { echo "::error::$name failed"; failed=1; }
            echo "::endgroup::"
          done
          exit $failed

  java:
    name: Java ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [fizzbuzz, hangman, mastermind]
    defaults:
      run:
        working-directory: java/${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B test
