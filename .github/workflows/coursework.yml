name: Coursework tests

on:
  push:
    branches: [main]
    paths: ['python/**', 'java/**', '.github/workflows/coursework.yml']
  pull_request:
    paths: ['python/**', 'java/**', '.github/workflows/coursework.yml']

permissions:
  contents: read

jobs:
  python:
    name: Python projects
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run each project's unit tests
        # toy-robot-5-maze is an unfinished submission whose maze.text
        # module was never written, so it is skipped.
        run: |
          failed=0
          for dir in python/*/; do
            name=$(basename "$dir")
            [ "$name" = toy-robot-5-maze ] && continue
            echo "::group::$name"
            (cd "$dir" && python -m unittest < /dev/null) || { echo "::error::$name failed"; failed=1; }
            echo "::endgroup::"
          done
          exit $failed

  java:
    name: Java ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [fizzbuzz, hangman, mastermind]
    defaults:
      run:
        working-directory: java/${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Java 11 is what the course used and what the pom.xml files target.
          # The tests use Mockito 3.6, which can't mock java.util.Random on 17.
          java-version: '11'
          cache: maven
      - run: mvn -B test
      - name: Start the game (checks that 'mvn compile exec:java' works)
        if: matrix.project != 'fizzbuzz'
        run: |
          if [ "${{ matrix.project }}" = mastermind ]; then
            yes 1111 | head -n 12 | mvn -B -q compile exec:java | tee run.log
            grep -q "The code was" run.log
          else
            printf '\nquit\n' | mvn -B -q compile exec:java | tee run.log
            grep -q "Bye!" run.log
          fi
