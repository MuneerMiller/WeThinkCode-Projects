name: Elderly Care release (Google Play)

# Builds the signed Android App Bundle (.aab) to upload to Google Play.
# Run it from the Actions tab ("Run workflow").
#
# One-time setup, under Settings → Secrets and variables → Actions:
#   ANDROID_KEYSTORE_BASE64   base64 of your upload keystore (.jks):
#                             base64 -w0 elderly-care-upload.jks
#   ANDROID_KEYSTORE_PASSWORD keystore password
#   ANDROID_KEY_ALIAS         key alias (e.g. upload)
#   ANDROID_KEY_PASSWORD      key password
# Keep a copy of the keystore and passwords somewhere safe: Play App
# Signing lets Google reset a lost upload key, but it takes days.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Signed Android App Bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: elderly_app-master
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Check the signing secrets are set
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for v in KEYSTORE STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then
              echo "::error::Signing secret for $v is missing. See the comments at the top of this workflow."
              exit 1
            fi
          done

      - name: Write the upload key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"
          {
            echo "storeFile=$RUNNER_TEMP/upload.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Test
        run: flutter test

      - name: Build the App Bundle
        run: flutter build appbundle --release

      - name: Make sure it is not signed with the debug key
        run: |
          cert=$(keytool -printcert -jarfile build/app/outputs/bundle/release/app-release.aab)
          echo "$cert" | grep -E "Owner:|SHA256:" || true
          if echo "$cert" | grep -q "CN=Android Debug"; then
            echo "::error::The bundle is signed with the debug key."
            exit 1
          fi

      - name: Remove the key from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks" android/key.properties

      - uses: actions/upload-artifact@v4
        with:
          name: elderly-care-play-bundle
          path: elderly_app-master/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
