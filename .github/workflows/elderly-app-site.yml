name: Elderly Care website

# Publishes the privacy policy, terms and support pages that the App Store
# and Google Play require, and a live web demo of the app (…/demo.html),
# at https://muneermiller.github.io/WeThinkCode-Projects/
# One-time setup: repository Settings → Pages → Source: GitHub Actions.

on:
  push:
    branches: [main]
    paths: ['elderly_app-master/**', '.github/workflows/elderly-app-site.yml']
  pull_request:
    paths: ['elderly_app-master/**', '.github/workflows/elderly-app-site.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: elderly-app-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true
      - name: Build the web demo
        working-directory: elderly_app-master
        run: |
          flutter pub get
          tool/build_demo.sh
      - name: Build the site
        run: python3 elderly_app-master/tool/build_site.py
      - uses: actions/upload-pages-artifact@v5
        with:
          path: elderly_app-master/build/site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
