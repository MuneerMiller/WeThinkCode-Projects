name: Elderly Care app

on:
  push:
    branches: [main]
    paths: ['elderly_app-master/**', '.github/workflows/elderly-app.yml']
  pull_request:
    paths: ['elderly_app-master/**', '.github/workflows/elderly-app.yml']

jobs:
  check:
    name: Analyze, test and build web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: elderly_app-master
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Install pdftotext (used to check the PDF summary)
        run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils

      - name: Unit and widget tests
        run: flutter test

      - name: Web demo tests
        run: flutter test --dart-define=DEMO=true test/demo_test.dart

      - name: Build web app (with Content-Security-Policy)
        run: tool/build_web.sh

  android:
    name: Build Android app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: elderly_app-master
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Build APK
        run: flutter build apk --release

      - name: Keep the APK for testing on a phone
        uses: actions/upload-artifact@v7
        with:
          name: elderly-care-android
          path: elderly_app-master/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  ios:
    name: Build iOS app (unsigned)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: elderly_app-master
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Build for iOS
        run: flutter build ios --release --no-codesign
