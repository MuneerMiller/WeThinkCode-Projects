name: Elderly Care app

on:
  push:
    branches: [main]
    paths: ['elderly_app-master/**', '.github/workflows/elderly-app.yml']
  pull_request:
    paths: ['elderly_app-master/**', '.github/workflows/elderly-app.yml']

jobs:
  check:
    name: Analyze, test and build web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: elderly_app-master
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Unit and widget tests
        run: flutter test

      - name: Build web app (with Content-Security-Policy)
        run: tool/build_web.sh
