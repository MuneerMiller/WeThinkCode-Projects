name: elderly_app
description: "Elderly Care: medicines, appointments, health tracking and emergency help in one place."
publish_to: 'none'
version: 2.0.0+3

environment:
  sdk: ^3.9.0

dependencies:
  cryptography: ^2.9.0
  file_picker: ^13.3.0
  fl_chart: ^1.3.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.3
  flutter_secure_storage: ^11.2.0
  flutter_timezone: ^5.1.1
  geolocator: ^14.1.2
  http: ^1.6.0
  image_picker: ^1.2.4
  intl: ^0.20.3
  local_auth: ^3.0.2
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  timezone: ^0.11.2
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Lexend
      fonts:
        - asset: assets/fonts/Lexend-400.ttf
        - asset: assets/fonts/Lexend-600.ttf
          weight: 600
        - asset: assets/fonts/Lexend-700.ttf
          weight: 700
